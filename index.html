<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Servants of Nadir — carta</title>
  <link rel="stylesheet" href="./assets/card.css">
</head>
<body>
  <card-data>
    <div class="card-bleed">
      <carta class="trim">
        <bordinha></bordinha>
        <safe-area>
          <anchor class="top-left"><cost class="golden-border"><span></span></cost></anchor>
          <anchor class="top">
            <card-name><span></span></card-name>
            <card-archetype></card-archetype>
          </anchor>
          <anchor class="top-right">
            <attribute class="golden-border"></attribute>
            <hp><span></span></hp>
          </anchor>
          <anchor class="bottom">
            <effect><effect-text></effect-text><effect-box></effect-box></effect>
          </anchor>
        </safe-area>
      </carta>
    </div>
  </card-data>
  <script type="module">
    import { applyCard } from "./src/layout.mjs";
    import { parseDeck } from "./src/cards.mjs";
    import { resolveGroupFontSizes } from "./src/font-groups.mjs";
    const response = await fetch("./cards/Fluffusion.json");
    const cards = parseDeck(await response.json());
    const preview = document.querySelector("card-data");
    preview.style.visibility = "hidden";
    try {
      const sizes = await resolveGroupFontSizes(cards, async card => {
        await applyCard({ card, art: null });
        const effect = document.querySelector("effect-text");
        if (!effect) throw new Error("Template sem effect-text para medir a fonte");
        return parseFloat(effect.style.fontSize);
      });
      const first = cards[0];
      const card = sizes.has(first) ? { ...first, font_size: sizes.get(first) } : first;
      await applyCard({ card, art: card.art ? new URL(card.art, location.href).href : null, guides: true });
    } finally { preview.style.removeProperty("visibility"); }
  </script>
</body>
</html>
